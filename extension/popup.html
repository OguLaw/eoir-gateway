<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 320px; padding: 20px; font-family: -apple-system, system-ui, sans-serif; background: #f8fafc; }
  h3 { font-size: 16px; color: #1e293b; margin-bottom: 4px; }
  .sub { font-size: 12px; color: #64748b; margin-bottom: 16px; }
  label { font-size: 12px; font-weight: 600; color: #475569; text-transform: uppercase; letter-spacing: 0.5px; }
  input { width: 100%; padding: 10px; margin: 6px 0 14px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; }
  input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
  button { width: 100%; padding: 12px; background: linear-gradient(135deg, #1e40af, #3b82f6); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .status { text-align: center; margin-top: 10px; font-size: 13px; font-weight: 500; }
  .ok { color: #16a34a; }
  .err { color: #dc2626; }
</style>
</head>
<body>
  <h3>⚖️ EOIR Auto-Login</h3>
  <p class="sub">Vercel Gateway URL'nizi girin</p>
  <label>Gateway URL</label>
  <input id="url" placeholder="https://eoir-gateway.vercel.app" spellcheck="false" />
  <button id="save">Kaydet</button>
  <p id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
